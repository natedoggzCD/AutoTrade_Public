services:
  autotrade-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: autotrade-public:test
    environment:
      AUTOTRADE_ROOT: /workspace
      DOWNDAY_ROOT: /workspace/data/downday
      ALPACA_PAPER: "true"
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
    volumes:
      - ./data/downday:/workspace/data/downday
      - ./logs:/workspace/logs
    command: python -m pytest tests/test_data_ingestion_module.py::TestIngestionPaths -q

  autotrade-shell:
    profiles: ["shell"]
    build:
      context: .
      dockerfile: Dockerfile
    image: autotrade-public:test
    environment:
      AUTOTRADE_ROOT: /workspace
      DOWNDAY_ROOT: /workspace/data/downday
      ALPACA_PAPER: "true"
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
    volumes:
      - ./data/downday:/workspace/data/downday
      - ./logs:/workspace/logs
    command: bash
