[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrade"
version = "0.1.1"
description = "AutoTrade autonomous trading agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alpaca-py>=0.21.0",
  "langgraph>=0.2.0",
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.6",
  "websockets>=12.0",
  "llama-index>=0.11.0",
  "llama-index-llms-ollama>=0.3.0",
  "llama-index-embeddings-huggingface>=0.3.0",
  "llama-index-vector-stores-chroma>=0.3.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=2.2.0",
  "transformers>=4.47.1,<5.0.0",
  "huggingface-hub>=0.34.3,<1.0.0",
  "torch>=2.0.0",
  "finvizfinance>=0.14.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "yfinance>=0.2.35",
  "duckdb>=0.10.0",
  "matplotlib>=3.8.0",
  "mplfinance>=0.12.0",
  "tables>=3.9.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "aiohttp>=3.9.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.66.0",
  "playwright>=1.40.0",
  "mss>=9.0.0",
  "Pillow>=10.0.0",
  "pylance>=0.10.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "asyncio-throttle>=1.0.0",
  "openai>=1.30.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrade*", "config*"]
