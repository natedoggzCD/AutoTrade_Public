premarket_scalp:
  # Premarket scalp lane: opportunistic plays on extreme-gap-up names.
  # Hard rules: never held into the regular session — every position
  # liquidated before 09:30 ET. Paper-account only by intent; user can
  # reset paper if anything goes sideways.
  #
  # DISABLED 2026-05-07: initial implementation churned 5 gap-ups for
  # small losses each (AAON, DDOG, WRBY, XMTR, PTON) because:
  #   - it bought as late as T-35 from open, leaving too little runway
  #   - had no per-position P&L stop or trailing during the hold
  #   - exited at premarket bids that are wide-spread and discount-priced
  #
  # day-manager 2026-05-19 (H1) REDESIGN — landed but kept disabled until
  # the user clears the paper-validation bar (5 sessions with PF >= 1.2):
  #   - Entry window narrowed to T-90 .. T-45 (no entries after T-45).
  #   - Combined momentum gate (3 consec up bars + 1.5x volume +
  #     last > premarket VWAP + within 1.5% of VWAP) gates each candidate.
  #   - Dynamic exits per position: hard stop -1.0%, trailing stop 1.0%
  #     armed once peak >= +1.5%, max-hold 25 min. Timer ladder remains
  #     as the final safety net.
  #   - Daily circuit breaker: 3 consec losses OR cum P&L <= -$200
  #     disables the lane for the rest of the session.
  #   - Telemetry written to logs/premarket_scalp_telemetry_<date>.jsonl.
  # day-manager 2026-05-20: user enabled scalp lane for tomorrow. paper_only
  # stays true by intent; circuit-breaker armed (3 consec losses or -$200 cum).
  enabled: true
  paper_only: true
  # Max concurrent open scalp positions at any time.
  max_concurrent_positions: 5
  # Max total scalp buy attempts per day. Sets the daily observation
  # window: at most 10 round-trips per session.
  max_orders_per_day: 10
  size_usd: 1500.0
  min_gap_pct: 5.0
  min_volume_ratio: 3.0
  min_liquidity_score: 70
  # New entry window (H1 redesign). min_entry_minutes_before_open kept for
  # backwards-compat; the new keys take precedence.
  min_entry_minutes_before_open: 60
  entry_window_start_minutes_before_open: 90
  entry_window_end_minutes_before_open: 45
  # Combined momentum gate.
  momentum_min_consec_up_bars: 3
  momentum_min_volume_ratio: 1.5
  momentum_max_vwap_distance_pct: 1.5
  # Per-position dynamic exits.
  hard_stop_pct: 1.0
  trailing_stop_pct: 1.0
  trailing_arm_at_pct: 1.5
  max_hold_minutes: 25
  # Daily circuit breaker.
  circuit_breaker_consecutive_losses: 3
  circuit_breaker_daily_loss_dollars: -200.0
  telemetry_path: logs/premarket_scalp_telemetry.jsonl
  max_spread_pct: 1.0
  profit_take_pct: 5.0
  require_sector_alignment: true
  # 3-tier escalating exit before regular open (09:30 ET):
  #   force      = first attempt with a fair-price limit at the bid.
  #   aggressive = "market sell" equivalent — limit at bid * 0.95.
  #                Alpaca rejects literal market orders in extended
  #                hours, so this is how we sweep the book at T-10.
  #   emergency  = $0.01 limit. Pay whatever to be flat by 09:30.
  force_exit_minutes_before_open: 15
  aggressive_exit_minutes_before_open: 10
  emergency_exit_minutes_before_open: 1
overnight_cut_policy:
  # H1 D3 (2026-05-22): backtested weak-only T-15 overnight-risk trim.
  # Broad hard cuts lost money in the backtest; live policy only trims
  # positions whose entry+30m P&L was <= -1.0%. DecisionClaw is shadow-only
  # here and cannot veto/force orders.
  enabled: true
