  - 6.0
  rsi_max: 75
  rsi_min: 40.0
  scan_types:
  - momentum_breakout
  - mean_reversion
  - earnings_momentum
  score_weights:
    momentum: 0.3
    pullback: 0.1
    trend: 0.15
    volatility: 0.2
    volume: 0.25
signal_generation:
  enabled: true
  baseline_signal_a_name: SignalA_v0
  baseline_signal_b_name: SignalB_v0
  day_manager_pipeline_enabled: true
  day_manager_alpha_blend_weight: 0.3
  day_manager_enrichment_cache_enabled: true
  alpha_generation_max_workers: 4
  llm_overlay:
    enabled: false
    mode: reject_veto_only
    single_model: qwen3.5:9b-q4_K_M
    promote_model: qwen3:14b-q4_K_M
    reject_model: phi4:14b-q4_K_M
    top_slice_size: 30
    timeout_seconds: 10
    min_confidence_to_override: 70.0
    min_benchmark_improvement_margin: 3.0
    benchmark_report_path: reports/llm_signal_layer_benchmark_latest.json
  enable_regime_router: true
  regime_router_default: neutral
  combine_method: weighted_sum
  min_composite_score: 35.0
  max_signals_per_batch: 200
  determinism_seed: 42
  fail_fast_on_schema_violation: true
  signal_zoo_min_count: 10
  signal_zoo_target_count: 20
  families_enabled:
    - ts_momentum
    - xs_momentum
    - mean_reversion
    - breakout
    - pullback
    - pairs
  ts_momentum:
    lookback_long_bars: 252
    lookback_short_bars: 126
    exclude_recent_bars: 21
  breakout:
    donchian_window: 20
    squeeze_percentile_window: 120
  mean_reversion:
    rsi_window: 2
    rsi_entry_threshold: 10
  pairs:
    zscore_entry_threshold: 2.0
  ensemble:
    enable_ev_calibration: true
    calibration_lookback_bars: 252
    output_range: [-1.0, 1.0]
  regime:
    rule_labels:
      - trend
      - chop
      - crisis
    probabilistic_model: hmm_optional
    family_enable_policy:
      ts_momentum: [trend]
      xs_momentum: [trend]
      mean_reversion: [chop, crisis]
      breakout: [trend]
      pullback: [trend]
      pairs: [chop]
      baseline_a: [trend, chop, crisis, neutral]
      baseline_b: [trend, chop, crisis, neutral]
      inverse_etf: [crisis]
  inverse_etf_hedging:
    enabled: true
    max_portfolio_allocation_pct: 15.0
    allowed_regimes: [crisis, risk_off]
    max_hold_days: 3
    symbols:
      - SH   # 1x Inverse S&P 500
      - PSQ  # 1x Inverse Nasdaq 100
      - RWM  # 1x Inverse Russell 2000
      - DOG  # 1x Inverse Dow 30
      - SDS  # 2x Inverse S&P 500 (use with caution)

