# day-manager 2026-05-19 (H8), wired live 2026-05-26: loss-floor exit policy.
# Tiers fire when pnl_pct <= max_pnl_pct AND held_minutes >= min_held_minutes.
# Hardest tier fires first; pnl_pct alone decides (no score check, per D3).
loss_floor:
  enabled: true
  ladder:
    - max_pnl_pct: -2.0
      min_held_minutes: 60
    - max_pnl_pct: -3.5
      min_held_minutes: 30
    - max_pnl_pct: -5.0
      min_held_minutes: 0
  telemetry_path: logs/loss_floor_telemetry.jsonl
