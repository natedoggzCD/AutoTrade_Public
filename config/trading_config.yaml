  signals_per_day: 100
  slippage_pct: 0.0002
  spread_pct: 0.00035
  stop_atr: 2.0
  target_atr: 3.0
  use_news: true
  strategy_backtester:
    cache_staleness_hours: 24
    min_trades_for_validity: 12
    gate_win_rate: 40
    gate_min_trades: 12
    boost_win_rate: 55
    boost_min_trades: 20
    batch_prefetch_size: 200
    yfinance_rate_limit: 5
    score_win_rate_high: 60
    score_win_rate_mid: 50
    score_win_rate_low: 40
    score_win_rate_weak: 30
    score_avg_gain_high: 2.0
    score_avg_gain_mid: 1.0
    score_avg_gain_low: 0.0
    score_avg_gain_penalty: -1.0
    score_backtest_weight_no_vl: 0.05
    score_backtest_weight_with_vl: 0.05
backtest_protocol:
  enabled: true
  walk_forward:
    mode: rolling
    train_days: 90
    test_days: 30
  nested_validation:
    enabled: true
    inner_folds: 3
  transaction_cost_sensitivity:
    commission_pct:
    - 0.0005
    - 0.001
    - 0.002
    slippage_pct:
    - 0.0002
    - 0.0005
    - 0.001
    spread_pct:
    - 0.0005
    - 0.001
    - 0.002
  leakage_guard:
    fail_on_detected_leakage: true
  paper_gate:
    min_out_of_sample_trades: 30
  multiple_testing_control:
    method: dsr+spa
    min_candidate_count: 20
    bootstrap_samples: 1000
    alpha: 0.05
  selection_bias_control:
    enable_pbo: true
    pbo_min_folds: 8
  inference:
    robust_sharpe_test: bootstrap
    robust_sharpe_min_pvalue: 0.05
execution:
  mode: paper
  default_order_type: market
  sim:
    seed: 42
    latency_ms_min: 50
    latency_ms_max: 500
    partial_fill_enabled: true
    cannot_fill_probability: 0.02
  cost:
    commission_pct: 0.0
    slippage_pct: 0.0002
    spread_pct: 0.00035
  entry:
    enabled: true
    high_urgency_min_score: 72.0
    critical_urgency_min_score: 84.0
    replace_schedule_seconds: [20, 45, 90]
    max_replacements: 3
    min_reprice_gap_pct: 0.2
    stale_after_seconds: 300
    escalate_to_marketable_min_score: 85.0
    escalate_to_marketable_min_dollar_vol: 2500000.0
    normal:
      max_chase_bps: 8
      max_slippage_bps: 12
    high:
      max_chase_bps: 18
      max_slippage_bps: 20
    critical:
      max_chase_bps: 30
      max_slippage_bps: 30
