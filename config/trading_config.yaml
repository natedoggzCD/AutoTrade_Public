posture:
  stress_window_minutes: 90
  hard_stop_lockout_minutes: 90

# Multi-cycle memory: thesis cache persists advisor reasoning across cycles
thesis_cache:
  enabled: true
  persist_to_disk: true
  persist_path: "data/position_theses.json"
  max_history_entries: 10
  archive_path: "data/thesis_archive.jsonl"

# Tier-based position scheduling: adaptive monitoring cadence per position
position_scheduler:
  enabled: true
  tiers:
    critical:
      interval_seconds: 30    # Near stop, first 15 min, earnings day
    active:
      interval_seconds: 60    # New entry < 1 hour, significant move
    stable:
      interval_seconds: 180   # Thesis intact, low volatility
    dormant:
      interval_seconds: 300   # Well in profit, far from key levels
  force_eval_price_move_bps: 50    # Override: force eval on 50 bps move
  force_eval_pnl_change_pct: 1.0   # Override: force eval on 1% P&L shift

